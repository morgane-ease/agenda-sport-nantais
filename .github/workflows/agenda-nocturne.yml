name: Agenda nocturne

on:
  schedule:
    - cron: '30 2 * * *'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Régénérer la page depuis Google Agenda
        run: node update-agenda.mjs docs/index.html
      - name: Publier
        run: |
          git config user.name "agenda-bot"
          git config user.email "agenda-bot@users.noreply.github.com"
          git add docs/index.html
          git diff --cached --quiet || git commit -m "Mise à jour de l'agenda"
          git push
